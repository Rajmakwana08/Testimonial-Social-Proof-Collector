{% extends "base.html" %}

{% block body_class %}
    auth-page
{% endblock %}

{% block content %}
<section class="single-card-wrap">
    <div class="auth-card card">

        <div class="success-icon">✓</div>

        <h1>Password updated</h1>

        <p class="muted">
            You can now sign in with your new password.
        </p>

        <a
            class="button button-primary button-full"
            href="{% url 'login' %}"
        >
            Sign in
        </a>

    </div>
</section>
{% endblock %}
